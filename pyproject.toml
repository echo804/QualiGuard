[project]
name = "qualiguard"
version = "0.1.0"
description = "QualiGuard - AI-powered code quality analysis CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "qujie", email = "c100_0911@qq.com"}]

dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
chat = ["openai>=1.0.0"]
dev = ["pytest", "ruff", "build", "twine"]

[project.scripts]
qg = "guardian.cli.app:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [".*"]